<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/trackit-logo.jpg" />
    <link rel="apple-touch-icon" href="/trackit-logo.jpg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Workout Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Jost:wght@400;500;600;700;800&family=Barlow:wght@400;500;600;700;800&family=Teko:wght@400;500;600;700&family=Kanit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body { background-color: #0A0A0A; margin: 0; }
      .app-loader { display: flex; flex-direction: column; height: 100dvh; max-width: 32rem; margin: 0 auto; padding: 2rem 1rem; box-sizing: border-box; }
      .shimmer { background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 0.75rem; }
      @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
      .loader-header { height: 4rem; width: 50%; margin-bottom: 2rem; border-radius: 1rem; }
      .loader-card { height: 8rem; width: 100%; margin-bottom: 1rem; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-loader">
        <div class="shimmer loader-header"></div>
        <div class="shimmer loader-card"></div>
        <div class="shimmer loader-card"></div>
        <div class="shimmer loader-card"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
